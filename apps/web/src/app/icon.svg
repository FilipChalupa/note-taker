<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- microphone capsule -->
  <rect x="196" y="96" width="120" height="216" rx="60" fill="#fff"/>
  <!-- capsule grille lines -->
  <g stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <line x1="226" y1="160" x2="286" y2="160"/>
    <line x1="226" y1="200" x2="286" y2="200"/>
    <line x1="226" y1="240" x2="286" y2="240"/>
  </g>
  <!-- cradle -->
  <path d="M150 250 a106 106 0 0 0 212 0" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
  <!-- stand -->
  <line x1="256" y1="356" x2="256" y2="410" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
  <line x1="192" y1="416" x2="320" y2="416" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
  <!-- sound waves -->
  <g fill="none" stroke="#bfdbfe" stroke-width="16" stroke-linecap="round">
    <path d="M382 170 a70 70 0 0 1 0 100"/>
    <path d="M130 170 a70 70 0 0 0 0 100"/>
  </g>
</svg>
