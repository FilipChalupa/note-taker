# Run BOTH services on one machine with an NVIDIA GPU (requires nvidia-container-toolkit).
#   cp apps/worker/.env.example apps/worker/.env   # set HF_TOKEN
#   docker compose -f docker-compose.all.yml up -d --build
services:
  worker:
    build:
      context: ./apps/worker
    image: note-taker-worker:latest
    container_name: note-taker-worker
    restart: unless-stopped
    env_file:
      - ./apps/worker/.env
    environment:
      WORKER_DATA_DIR: /data
      HF_HOME: /models
    volumes:
      - worker-data:/data
      - worker-models:/models
    ports:
      - "${WORKER_PORT:-8000}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: note-taker-web:latest
    container_name: note-taker-web
    restart: unless-stopped
    depends_on:
      - worker
    environment:
      WORKER_API_URL: http://worker:8000
      WORKER_API_KEY: ${WORKER_API_KEY:-}
      DATA_DIR: /data
      IMPORT_DIR: /data/import
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-cs}
      TZ: ${TZ:-Europe/Prague}
      INTAKE_URL: ${INTAKE_URL:-}
      INTAKE_TOKEN: ${INTAKE_TOKEN:-}
    volumes:
      - web-data:/data
      - ./import:/data/import
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Optional public upload page. Start with: docker compose -f docker-compose.all.yml --profile intake up -d
  intake:
    profiles: ["intake"]
    build:
      context: ./apps/intake
    image: note-taker-intake:latest
    container_name: note-taker-intake
    restart: unless-stopped
    environment:
      INTAKE_COLLECT_TOKEN: ${INTAKE_TOKEN:?set INTAKE_TOKEN to use the intake profile}
      INTAKE_UPLOAD_CODE: ${INTAKE_UPLOAD_CODE:-}
      DATA_DIR: /data
    volumes:
      - intake-data:/data
    ports:
      - "${INTAKE_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  intake-data:
  worker-data:
  worker-models:
  web-data:
